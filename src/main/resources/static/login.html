<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>Đăng nhập | E-Learning</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(ellipse at 50% 0%, #e0f2fe 0, #f8fafc 58%);
    }
    .auth-card {
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 16px 40px rgba(15, 23, 42, .08);
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      border-radius: 14px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 22px;
      font-weight: 800;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: -.04em; }
    .subtitle { margin: 9px 0 27px; color: #475569; font-size: 14px; line-height: 1.6; }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      margin-bottom: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
    }
    .tab {
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
    }
    .tab.active { background: #e0f2fe; color: #075985; }
    .form-group { margin: 0 0 17px; }
    label { display: block; margin-bottom: 8px; color: #334155; font-size: 13px; font-weight: 650; }
    input {
      width: 100%;
      min-height: 44px;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      font: inherit;
      font-size: 14px;
    }
    input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, .12); }
    .hint { margin: 7px 0 0; color: #64748b; font-size: 12px; line-height: 1.5; }
    .primary-button {
      width: 100%;
      min-height: 46px;
      margin-top: 5px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      transition: background .15s, transform .15s;
    }
    .primary-button:hover { background: #0369a1; }
    .primary-button:active { transform: translateY(1px); }
    .primary-button:disabled { cursor: wait; opacity: .65; }
    .notice { display: none; margin: 0 0 17px; padding: 11px 13px; border: 1px solid; border-radius: 9px; font-size: 13px; line-height: 1.5; }
    .notice.visible { display: block; }
    .notice.error { border-color: #fecaca; background: #fef2f2; color: #b91c1c; }
    .notice.success { border-color: #bbf7d0; background: #f0fdf4; color: #166534; }
    @media (max-width: 480px) { .auth-card { padding: 26px 22px; } }
  </style>
</head>
<body>
<main class="auth-card">
  <div class="brand-mark" aria-hidden="true">E</div>
  <h1>Nền tảng E-Learning</h1>
  <p class="subtitle">Đăng nhập để tiếp tục học tập và truy cập học liệu của bạn.</p>

  <div class="tabs" role="tablist" aria-label="Xác thực tài khoản">
    <button class="tab active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">Đăng nhập</button>
    <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel">Đăng ký</button>
  </div>

  <section id="login-panel" role="tabpanel" aria-labelledby="login-tab">
    <div id="login-notice" class="notice error" role="alert"></div>
    <div id="logout-notice" class="notice success" role="status">Bạn đã đăng xuất thành công.</div>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Tên đăng nhập</label>
        <input id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="login-password">Mật khẩu</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary-button" id="login-submit" type="submit">Đăng nhập</button>
    </form>
  </section>

  <section id="register-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
    <div id="register-notice" class="notice" role="status"></div>
    <form id="register-form">
      <div class="form-group">
        <label for="register-username">Tên đăng nhập</label>
        <input id="register-username" name="username" minlength="4" maxlength="30" autocomplete="username" required>
        <p class="hint">Từ 4–30 ký tự; cho phép chữ, số, dấu chấm, gạch dưới và gạch ngang.</p>
      </div>
      <div class="form-group">
        <label for="register-full-name">Họ và tên</label>
        <input id="register-full-name" name="fullName" maxlength="100" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label for="register-password">Mật khẩu</label>
        <input id="register-password" name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
        <p class="hint">Ít nhất 8 ký tự, có chữ hoa, số và ký tự đặc biệt @$!%*?&amp;.</p>
      </div>
      <button class="primary-button" id="register-submit" type="submit">Tạo tài khoản sinh viên</button>
    </form>
  </section>
</main>

<script>
  const loginTab = document.getElementById('login-tab');
  const registerTab = document.getElementById('register-tab');
  const loginPanel = document.getElementById('login-panel');
  const registerPanel = document.getElementById('register-panel');

  function showTab(tab) {
    const showLogin = tab === 'login';
    loginTab.classList.toggle('active', showLogin);
    registerTab.classList.toggle('active', !showLogin);
    loginTab.setAttribute('aria-selected', String(showLogin));
    registerTab.setAttribute('aria-selected', String(!showLogin));
    loginPanel.hidden = !showLogin;
    registerPanel.hidden = showLogin;
  }

  function showNotice(element, message, kind) {
    element.textContent = message;
    element.className = `notice visible ${kind}`;
  }

  function responseMessage(data, fallback) {
    if (typeof data?.error === 'string') return data.error;
    if (typeof data?.message === 'string') return data.message;
    return fallback;
  }

  loginTab.addEventListener('click', () => showTab('login'));
  registerTab.addEventListener('click', () => showTab('register'));

  const params = new URLSearchParams(window.location.search);
  if (params.has('logout')) document.getElementById('logout-notice').classList.add('visible');
  if (params.has('error')) showNotice(document.getElementById('login-notice'), 'Sai tên đăng nhập hoặc mật khẩu.', 'error');

  document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = document.getElementById('login-submit');
    const notice = document.getElementById('login-notice');
    notice.classList.remove('visible');
    button.disabled = true;
    try {
      const response = await fetch('/perform_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: new URLSearchParams(new FormData(form))
      });
      const data = await response.json();
      if (!response.ok) throw new Error(responseMessage(data, 'Đăng nhập không thành công.'));
      if (typeof data.redirect !== 'string' || !data.redirect.startsWith('/')) {
        throw new Error('Phản hồi chuyển hướng đăng nhập không hợp lệ.');
      }
      window.location.assign(data.redirect);
    } catch (error) {
      showNotice(notice, error.message || 'Không thể kết nối tới máy chủ.', 'error');
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById('register-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.currentTarget;
    const button = document.getElementById('register-submit');
    const notice = document.getElementById('register-notice');
    notice.classList.remove('visible');
    button.disabled = true;
    const body = Object.fromEntries(new FormData(form).entries());

    try {
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await response.json();
      if (!response.ok) {
        const message = responseMessage(data, Object.values(data).find(value => typeof value === 'string') || 'Đăng ký không thành công.');
        throw new Error(message);
      }
      form.reset();
      showNotice(notice, 'Đăng ký thành công. Bạn có thể đăng nhập ngay.', 'success');
    } catch (error) {
      showNotice(notice, error.message || 'Không thể kết nối tới máy chủ.', 'error');
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
